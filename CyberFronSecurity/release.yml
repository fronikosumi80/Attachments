name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CyberFronSecurity/package-lock.json

      - name: Install dependencies
        working-directory: CyberFronSecurity
        run: npm ci

      - name: Build installer
        working-directory: CyberFronSecurity
        run: npm run dist

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: CyberFronSecurity/dist/CyberFronSecurity-Setup.exe
          generate_release_notes: true